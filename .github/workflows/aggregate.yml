name: Aggregate Daily Picks

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 PM UTC — after all sport repos have run
  workflow_dispatch:        # manual trigger
  repository_dispatch:      # triggered by sport repos after their own run

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch all picks
        run: python scripts/fetch_all_picks.py

      - name: Commit cached picks
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh data_cache [skip ci]"
          file_pattern: data_cache/*.json
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
