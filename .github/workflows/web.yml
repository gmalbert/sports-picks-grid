name: Validate React and Worker

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'data_files/sources.json'
      - 'worker/**'
      - 'public/**'
      - 'tests/web/**'
      - 'tests/fixtures/**'
      - 'tests/*.py'
      - 'utils/**'
      - 'scripts/fetch_all_picks.py'
      - 'scripts/prepare-web-data.mjs'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - 'wrangler.jsonc'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'data_files/sources.json'
      - 'worker/**'
      - 'public/**'
      - 'tests/web/**'
      - 'tests/fixtures/**'
      - 'tests/*.py'
      - 'utils/**'
      - 'scripts/fetch_all_picks.py'
      - 'scripts/prepare-web-data.mjs'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - 'wrangler.jsonc'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -v

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
