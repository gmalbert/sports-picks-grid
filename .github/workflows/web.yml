name: Validate React and Worker

on:
  pull_request:
    paths:
      - 'src/**'
      - 'shared/**'
      - 'worker/**'
      - 'public/**'
      - 'tests/web/**'
      - 'scripts/prepare-web-data.mjs'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - 'wrangler.jsonc'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'shared/**'
      - 'worker/**'
      - 'public/**'
      - 'tests/web/**'
      - 'scripts/prepare-web-data.mjs'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - 'wrangler.jsonc'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
